# Universal CI fallback for skill-x drift detection.
# Fires when package.json is touched and on a daily schedule.
# Generated by tools/gen-hooks.mjs from hooks.spec.json. Do not edit by hand.
name: skill-x drift check

on:
  push:
    paths:
      - "package.json"
      - "skills/**/SKILL.md"
  pull_request:
    paths:
      - "package.json"
      - "skills/**/SKILL.md"
  schedule:
    - cron: "0 6 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Detect upstream drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/sync.mjs --check
      - name: Detect derived-skill staleness
        run: node tools/compose.mjs --check
